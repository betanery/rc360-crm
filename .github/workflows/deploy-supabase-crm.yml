name: Deploy RC360 CRM Supabase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_PRODUCTION to authorize production deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rc360-crm-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: vvmsikxxoamwqjuihtjk

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing required GitHub secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" >/dev/null

      - name: Link Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Repair initial migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 001 --status applied || true
          supabase migration repair 002 --status applied || true
          supabase migration repair 003 --status applied || true
          supabase migration repair 004 --status applied || true
          supabase migration list

      - name: Push database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Deploy CRM Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in crm-automation crm-inbound crm-import crm-whatsapp-test crm-email-test; do
            echo "Deploying ${function_name}..."
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Verify remote functions
        shell: bash
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
